<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Summarizer Demo</title>
</head>
<body>
  <textarea id="input" rows="10" cols="60">Paste the long text here …</textarea>
  <button id="btn">Summarize</button>
  <div id="output"></div>

  <script type="module">
    const btn = document.getElementById('btn');
    const inputEl = document.getElementById('input');
    const outputEl = document.getElementById('output');

    btn.addEventListener('click', async () => {
      if (!('Summarizer' in window)) {
        outputEl.textContent = "Summarizer API not supported";
        return;
      }

      const options = {
        type: "key-points",
        length: "short",
        format: "plain-text",
        language: 'en'
      };
      const avail = await Summarizer.availability(options);
      if (avail === "unavailable") {
        outputEl.textContent = "This summarizer configuration is unavailable";
        return;
      }

      const summarizer = await Summarizer.create(options);
      try {
        const summary = await summarizer.summarize(inputEl.value);
        outputEl.textContent = summary;
      } catch (err) {
        console.error("Summarizing failed:", err);
        outputEl.textContent = "Error during summarization";
      } finally {
        summarizer.destroy();
      }
    });
  </script>
</body>
</html>
